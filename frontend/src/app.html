<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<title>Arcana</title>
		<script>
			// Stamp the theme before first paint to avoid a flash of the wrong palette.
			// Dark is the default; only a stored choice of light overrides it.
			// The key is versioned: choices saved under the old 'arcana-theme' key
			// predate the dark default and are deliberately ignored.
			try {
				var t = localStorage.getItem('arcana-theme-v2');
				document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
