# Application properties for LOCAL development profile
# Uses LocalStack for S3 instead of real AWS

# LocalStack Configuration
aws.use-localstack=true
aws.localstack.endpoint=http://localhost:4566

# S3 Configuration (LocalStack)
aws.s3.bucket-name=archiving-system-uploads
aws.s3.region=us-east-1
aws.s3.access-key=test
aws.s3.secret-key=test

# Enable debug logging for S3 operations
logging.level.com.dmc.archiving.storage=DEBUG
logging.level.software.amazon.awssdk=DEBUG

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/archiving
spring.datasource.username=archiving_user
spring.datasource.password=archiving_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (for scalability)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ArchivingHikariPool

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

