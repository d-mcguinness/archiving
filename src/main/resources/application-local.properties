# Application properties for LOCAL development profile
# Uses LocalStack for S3 instead of real AWS

# LocalStack Configuration
aws.use-localstack=true
aws.localstack.endpoint=http://localhost:4567

# S3 Configuration (LocalStack)
aws.s3.bucket-name=archiving-system-uploads
aws.s3.region=us-east-1
aws.s3.access-key=test
aws.s3.secret-key=test

# Enable debug logging for S3 operations
logging.level.com.dmc.archiving.storage=DEBUG
logging.level.software.amazon.awssdk=DEBUG

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/archiving
spring.datasource.username=archiving_user
spring.datasource.password=archiving_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Boot Docker Compose support: auto-start Postgres via compose.dev.yaml
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.dev.yaml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.wait=only-if-started

# HikariCP Connection Pool Configuration (for scalability)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ArchivingHikariPool

# JPA Configuration — Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations. baseline-on-migrate adopts an existing (previously
# ddl-auto-created) database at V1 the first time; a fresh database runs V1 onward.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# MCP Servers Configuration (for AI assistant integration)
# MCP servers provide tools for AI to interact with LocalStack and Database
mcp.enabled=true
mcp.localstack.enabled=true
mcp.datasource.enabled=true

