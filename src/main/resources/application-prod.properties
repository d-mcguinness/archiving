# Application properties for PRODUCTION profile
# Uses real AWS S3 with strict security

# ============================================================================
# Database — Postgres, supplied via the environment (no defaults in prod).
# ============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway owns the schema; Hibernate only validates it (never auto-DDL in prod).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Never allow a destructive Flyway clean against a production database.
spring.flyway.clean-disabled=true

# Do NOT run data.sql seeding in production.
spring.sql.init.mode=never

# LocalStack Configuration (disabled for production)
aws.use-localstack=false

# S3 Configuration (AWS Production)
# IMPORTANT: Use environment variables or AWS Secrets Manager
# In production, these MUST be set via environment variables or IAM roles
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:archiving-prod-uploads}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:placeholder-prod-access-key}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:placeholder-prod-secret-key}

# Auth token signing
# APP_AUTH_TOKEN_SECRET is REQUIRED under this profile: AuthSecurityConfig fails
# closed (the app refuses to start) if it is unset, so prod never signs tokens
# with the built-in DEV secret. Provide it via the environment / a secrets store.

# Production logging (less verbose)
logging.level.com.dmc.archiving.storage=INFO
logging.level.software.amazon.awssdk=WARN

