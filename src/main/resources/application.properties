server.port=2020
spring.application.name=archiving

# JPA Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# SQL Init Configuration - Execute data.sql on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# CORS Configuration
spring.graphql.cors.allowed-origins=http://localhost:3001,http://localhost:4173,http://localhost:5173
spring.graphql.cors.allowed-methods=*
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

# Disable Docker Compose integration by default
spring.docker.compose.enabled=false

# ============================================================================
# Auth token signing (demo scheme)
# ============================================================================
# HMAC-SHA256 secret for the bearer token issued at /api/auth/login and verified
# on every request. When unset:
#   - non-prod profiles fall back to a built-in DEV secret (tokens are then
#     DEMO-ONLY and forgeable by anyone with repo access);
#   - the 'prod' profile REFUSES to start (fail-closed) so production never runs
#     with a publicly known signing secret.
# Always set APP_AUTH_TOKEN_SECRET via the environment for any real deployment.
app.auth.token-secret=${APP_AUTH_TOKEN_SECRET:}

# Lifetime of an issued ACCESS token. The expiry (epoch millis) is part of the
# signed payload, so verify rejects a token once it elapses. Kept SHORT (15 min)
# because the access token is verified offline (no per-request DB lookup), so a
# logout/revoke only takes effect once it expires — this bounds that window. The
# client silently renews it via /api/auth/refresh before it lapses.
app.auth.token-ttl-minutes=${APP_AUTH_TOKEN_TTL_MINUTES:15}

# Lifetime of a REFRESH token (the longer-lived, DB-backed, single-use credential
# exchanged at /api/auth/refresh for a new access token). Each refresh rotates it;
# reuse of a rotated token revokes the whole session set. A real deploy needs the
# refresh_tokens table (auto-created by ddl-auto outside prod; see Flyway follow-up).
app.auth.refresh-token-ttl-days=${APP_AUTH_REFRESH_TOKEN_TTL_DAYS:14}

# ============================================================================
# Self-service signup rate limiting (per client IP)
# ============================================================================
# Caps automated account/tenant creation on the public POST /api/auth/register.
# In-memory + single-instance (a distributed deployment should back this with
# Redis). Every attempt — success or failure — counts toward the window.
app.signup.rate-limit.max-attempts=${SIGNUP_RATE_LIMIT_MAX:5}
app.signup.rate-limit.window-minutes=${SIGNUP_RATE_LIMIT_WINDOW_MINUTES:15}

# Login brute-force throttling: after this many FAILED logins (per account OR per
# client IP) within the window, /api/auth/login returns 429 until the window
# rolls over. A successful login clears the account's counter. In-memory +
# single-instance (back with Redis when distributed).
app.login.rate-limit.max-failures=${LOGIN_RATE_LIMIT_MAX_FAILURES:10}
app.login.rate-limit.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

# ============================================================================
# AWS S3 Cloud Storage Configuration
# ============================================================================
# This application supports multiple profiles for different environments:
#
# LOCAL (development with LocalStack):
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#   Uses LocalStack at http://localhost:4566
#   No real AWS credentials needed
#
# DEV (development with real AWS):
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   Uses real AWS S3 with dev bucket
#   Requires AWS credentials
#
# PROD (production):
#   mvn spring-boot:run -Dspring-boot.run.profiles=prod
#   Uses real AWS S3 with production bucket
#   Requires AWS credentials (preferably from IAM roles)
#
# Default profile uses LocalStack for convenience
# ============================================================================

# LocalStack Configuration
aws.use-localstack=${AWS_USE_LOCALSTACK:false}
aws.localstack.endpoint=${AWS_LOCALSTACK_ENDPOINT:http://localhost:4566}

# S3 Configuration (override in profile-specific files)
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:archiving-system-uploads}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:test}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:test}

# File Upload Configuration
# HTTP-layer ceiling set to the S3 single-PUT limit (5GB) so large-file uploads
# reach the controller; the actual per-file cap is enforced PER PLAN in
# DocumentService (default 50MB; ENTERPRISE/CUSTOM raised). Large multiparts
# spill to a temp file rather than memory.
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB





