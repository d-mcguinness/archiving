server.port=2020
spring.application.name=archiving

# JPA Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# SQL Init Configuration - Execute data.sql on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# CORS Configuration
spring.graphql.cors.allowed-origins=http://localhost:3001,http://localhost:4173,http://localhost:5173
spring.graphql.cors.allowed-methods=*
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

# Disable Docker Compose integration by default
spring.docker.compose.enabled=false

# ============================================================================
# AWS S3 Cloud Storage Configuration
# ============================================================================
# This application supports multiple profiles for different environments:
#
# LOCAL (development with LocalStack):
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#   Uses LocalStack at http://localhost:4566
#   No real AWS credentials needed
#
# DEV (development with real AWS):
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   Uses real AWS S3 with dev bucket
#   Requires AWS credentials
#
# PROD (production):
#   mvn spring-boot:run -Dspring-boot.run.profiles=prod
#   Uses real AWS S3 with production bucket
#   Requires AWS credentials (preferably from IAM roles)
#
# Default profile uses LocalStack for convenience
# ============================================================================

# LocalStack Configuration
aws.use-localstack=${AWS_USE_LOCALSTACK:false}
aws.localstack.endpoint=${AWS_LOCALSTACK_ENDPOINT:http://localhost:4566}

# S3 Configuration (override in profile-specific files)
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:archiving-system-uploads}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:test}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:test}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB





