server.port=2020
spring.application.name=archiving

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/archiving
spring.datasource.username=archiving_user
spring.datasource.password=archiving_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Init Configuration - Execute data.sql on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# CORS Configuration
spring.graphql.cors.allowed-origins=http://localhost:3000,http://localhost:4173,http://localhost:5173
spring.graphql.cors.allowed-methods=*
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

# Disable Docker Compose integration by default
spring.docker.compose.enabled=false
