server.port=2020
spring.application.name=archiving

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/archiving
spring.datasource.username=archiving_user
spring.datasource.password=archiving_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (for scalability)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ArchivingHikariPool

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JPA Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# SQL Init Configuration - Execute data.sql on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# CORS Configuration
spring.graphql.cors.allowed-origins=http://localhost:3000,http://localhost:4173,http://localhost:5173
spring.graphql.cors.allowed-methods=*
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

# Disable Docker Compose integration by default
spring.docker.compose.enabled=false
