# PostgreSQL Database for Docker
server.port=8080
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:db}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:archiving}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:archiving_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:archiving_pass}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema (V1 baseline + later migrations); Hibernate only
# validates. baseline-on-migrate adopts a container DB previously created by
# ddl-auto. Replaces the old ddl-auto=update stopgap.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
