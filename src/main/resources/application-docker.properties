# PostgreSQL Database for Docker
server.port=8080
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:db}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:archiving}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:archiving_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:archiving_pass}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Manage the schema with Hibernate for the demo container (no migration tool yet).
# Without this, ddl-auto defaults to 'none' against Postgres and no tables — incl.
# the users.username/password_hash columns — would be created. A real prod deploy
# should use Flyway/Liquibase instead (see PRICING_COGS / follow-ups).
spring.jpa.hibernate.ddl-auto=update
