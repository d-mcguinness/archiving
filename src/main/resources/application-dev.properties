# Development Profile - Use this to reset the database
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev-reset

server.port=2020
spring.application.name=archiving

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/archiving
spring.datasource.username=archiving_user
spring.datasource.password=archiving_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration — Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations. dev is the RESET profile: DevDatabaseConfig runs
# clean()+migrate() on every start (clean enabled below), so the schema is rebuilt
# fresh from migrations — the equivalent of the old ddl-auto=create-drop, and it
# auto-heals a DB that drifted under the former ddl-auto=update.
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

# SQL Init Configuration - Execute data.sql on startup (after Flyway).
# defer-datasource-initialization removed: it clashes with Flyway (circular
# depends-on flyway <-> entityManagerFactory) and is unneeded once Flyway owns
# the schema. continue-on-error=true keeps the demo seed restart-safe now that the
# schema persists (validate) instead of being recreated each start.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# CORS Configuration
spring.graphql.cors.allowed-origins=http://localhost:3001,http://localhost:4173,http://localhost:5173
spring.graphql.cors.allowed-methods=*
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

# Spring Boot Docker Compose support: auto-start Postgres via compose.dev.yaml
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.dev.yaml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.wait=only-if-started

# AWS S3 Configuration (Real AWS for dev)
# IMPORTANT: Set AWS credentials as environment variables for real AWS access
# export AWS_ACCESS_KEY_ID=your-key
# export AWS_SECRET_ACCESS_KEY=your-secret
# export AWS_S3_BUCKET_NAME=archiving-dev-uploads
aws.use-localstack=false
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:archiving-dev-uploads}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:placeholder-access-key}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:placeholder-secret-key}
