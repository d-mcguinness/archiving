# Test profile: use H2 in-memory database with PostgreSQL compatibility
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Signup/login/refresh rate limits: effectively off by default so the multi-request
# MVC tests aren't tripped; the dedicated rate-limit tests override via @TestPropertySource.
app.signup.rate-limit.max-attempts=1000
app.login.rate-limit.max-failures=1000
app.refresh.rate-limit.max-attempts=1000

# AWS S3 test defaults
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1
aws.s3.access-key=test
aws.s3.secret-key=test
aws.use-localstack=false
