services:
  db:
    image: postgres:15
    container_name: archiving-postgres-dev
    environment:
      POSTGRES_DB: archiving
      POSTGRES_USER: archiving_user
      POSTGRES_PASSWORD: archiving_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "archiving_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Let Spring Boot discover and auto-configure a DataSource
      org.springframework.boot.service-connection: postgresql

  localstack:
    image: localstack/localstack:3
    container_name: archiving-localstack-dev
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      # Host 4567 → container 4566 to avoid clashing with the vsware-docker
      # LocalStack stack, which already binds host 4566. The app's
      # aws.localstack.endpoint (application-local.properties) points here.
      - "4567:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

