version: '3.8'

services:
  db:
    image: postgres:15
    container_name: archiving-postgres-dev
    environment:
      POSTGRES_DB: archiving
      POSTGRES_USER: archiving_user
      POSTGRES_PASSWORD: archiving_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "archiving_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      # Let Spring Boot discover and auto-configure a DataSource
      org.springframework.boot.service-connection: postgresql

